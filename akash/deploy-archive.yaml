# Akash SDL — the archive / full-history RPC node that feeds the privacy indexer.
#
# Privacy relaunch. Wallets never ask anyone about their own notes: they
# download every note commitment, ciphertext, nullifier and identity leaf, and
# the backend's indexer (earth-network-backend, services/privacy) serves those
# as full ranges. The indexer reads CometBFT `block_results` from height 1, so
# the node behind it must hold every block AND every block's results, from
# genesis, for ever. This lease is that node. It is NOT the validator, it holds
# no keys, and it never signs.
#
# Build it with `--fullnode --no-statesync`, and `--tunnel --tunnel-var
# ARCHIVE_TUNNEL_TOKEN` once it has caught up:
#
#   bin/create.sh <tag> --sdl akash/deploy-archive.yaml --fullnode --no-statesync \
#       --var ARCHIVE_DSEQ --provider <ADX provider>
#   bin/deploy.sh <tag> --sdl akash/deploy-archive.yaml --dseq $ARCHIVE_DSEQ \
#       --fullnode --no-statesync --tunnel --tunnel-var ARCHIVE_TUNNEL_TOKEN
#
# build-sdl.py recognises NODE_ROLE=archive and refuses an SDL that would prune,
# discard block results, state sync, carry a consensus or node key, or join the
# VALIDATOR's tunnel (a second connector on one token is load-balanced the same
# hostnames, and roughly half of rpc.erth.network would answer from here).
#
# Why --no-statesync, and why replay is fine here: state sync floors a node at
# its trust height and CometBFT never backfills below it, which would leave the
# indexer a permanent hole. On a fresh genesis replay is cheap at first; it
# grows with every proof the chain has verified, so start this lease early and
# never let it go. Losing this volume means replaying the whole chain again.
#
# One thing this lease does NOT have: the 2026-09-01 lesson about on-volume
# keys. This volume never held a consensus key and never will;
# REQUIRE_NO_CONSENSUS_KEY=1 (added by build-sdl.py for every keyless
# --fullnode SDL) makes the entrypoint refuse to start if one ever appears.

version: "2.0"

services:
  node:
    # Pinned at deploy time by bin/deploy.sh / create.sh from the release tag.
    # Start at the LAUNCH tag, like the validator: cosmovisor walks the
    # upgrades from there.
    image: ghcr.io/zenopie/earth-network-chain@sha256:03c274793328ee4b1a4e38eab302a8b4040a7e27ce0fd35eaa21829331dd4377

    env:
      # TODO(relaunch): the chain id; see akash/deploy.yaml.
      - CHAIN_ID=earth-1
      - MONIKER=earth-akash-archive
      # Read by build-sdl.py only; the entrypoint ignores it.
      - NODE_ROLE=archive
      # Same floor as the validator, ERTH only. This node relays whatever is
      # broadcast to it, so it must agree with the validator on what is
      # acceptable rather than gossip txs the validator will drop.
      - MIN_GAS_PRICES=0.005uerth
      # REQUIRED on the privacy chain, as on the validator: the no-op app
      # mempool. Anything else rejects every private tx in CheckTx. See the
      # comment in akash/deploy.yaml.
      - EARTHD_MEMPOOL_MAX_TXS=-1
      # Join the genesis baked into the image; never invent one.
      - DEV_INIT=0
      #
      # ---- archive / full history -------------------------------------------
      #
      # All four are read by earthd itself from EARTHD_-prefixed env, which
      # overrides app.toml and config.toml (the entrypoint writes none of these
      # sections, and both files live on the volume).
      #
      # app.toml: keep every state version. Not needed by the indexer, which
      # reads blocks and block results, but it makes historical queries at any
      # height answerable (verify-trees.py compares the chain's own tree sizes
      # at the height it synced to), which is what "archive" means.
      - EARTHD_PRUNING=nothing
      # app.toml: never prune a block. 0 is the default; pinned.
      - EARTHD_MIN_RETAIN_BLOCKS=0
      # config.toml [storage]: keep FinalizeBlock responses. The indexer's
      # whole input is /block_results; with this true, results are dropped
      # after they are applied and the indexer halts on the first gap.
      - EARTHD_STORAGE_DISCARD_ABCI_RESPONSES=false
      # config.toml [tx_index]: index txs, so /tx and /tx_search answer here.
      # Failed private txs have no message.sender to search by (see the
      # backend README, failed-tx semantics); the index is still what lets an
      # operator find a tx by hash.
      - EARTHD_TX_INDEX_INDEXER=kv
      #
      # Snapshots stay on (entrypoint default, every 1000 blocks): with
      # pruning=nothing every height is available to snapshot, and a second
      # snapshot source is what lets future validators state sync.
      #
      # ---- peers -------------------------------------------------------------
      #
      # The validator, by its fixed node id (NODE_KEY_B64, injected into the
      # validator SDL with --node-key) at the host:port its lease was assigned.
      # TODO(relaunch): fill in once the validator lease exists — read the
      # assigned 26656 port from its lease status. This lease is created after
      # the validator's, so the address is known by then and no in-place PUT
      # of the validator is needed.
      - PERSISTENT_PEERS=<validator-node-id>@<validator-provider-host>:<port>
      #
      # Set with an in-place PUT once this lease's own 26656 port is known.
      # Optional: this node dials out to the validator and syncs without it.
      # - EXTERNAL_ADDRESS=<this-provider-host>:<port>
      #
      # ---- upgrades ----------------------------------------------------------
      #
      # Under cosmovisor, so a governance upgrade does not strand the archive at
      # the plan height while the validator moves on.
      - USE_COSMOVISOR=true
      # This volume grows without bound (pruning=nothing), and cosmovisor's
      # pre-upgrade backup copies all of data/. That copy is what filled the
      # validator's 20Gi volume at the v0.9.2 plan height and ended the old
      # chain. On a keyless node whose only loss is a replay, skip it.
      - UNSAFE_SKIP_BACKUP=true

    expose:
      # CometBFT RPC for the indexer, through this lease's own tunnel:
      # archive-rpc.erth.network -> http://node:26657 (configure on Cloudflare).
      # The backend's INDEXER_RPC_URL points at that hostname. Never a provider
      # port: the backend may share this provider, and a provider hostname from
      # inside its own cluster is a hairpin that hangs (see the backend SDL).
      - port: 26657
        as: 26657
        to:
          - service: cloudflared
      # p2p, so the validator and future joiners can dial in and this node adds
      # connectivity. Raw TCP; a tunnel cannot carry it.
      - port: 26656
        as: 26656
        to:
          - global: true

    params:
      storage:
        data:
          mount: /data
          readOnly: false

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - cloudflared
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    expose:
      - port: 2000
        as: 2000
        to:
          - global: true
    # TUNNEL_TOKEN is injected at deploy time from .env's ARCHIVE_TUNNEL_TOKEN
    # (--tunnel --tunnel-var ARCHIVE_TUNNEL_TOKEN). Until then it is a
    # placeholder and the connector restart-loops harmlessly, which is right
    # while the node is still replaying.
    env: []

profiles:
  compute:
    node:
      resources:
        # Replay verifies every proof the chain ever accepted (registrations,
        # and on this chain every private tx), so CPU matters more here than
        # on most archive nodes. The host MUST have ADX: earthd's prover/
        # verifier library crashes with "Illegal instruction" without it, even
        # on `earthd version`. Pin the lease to an ADX provider (create.sh
        # --provider; the chain's EPYC provider akash15tl6... is one).
        cpu:
          units: 2
        memory:
          # Match the validator. 1Gi starved the old node into constant reclaim.
          size: 4Gi
        storage:
          - size: 4Gi
          - name: data
            # TODO(relaunch): sizing. Nothing is ever pruned here and Akash
            # cannot grow a volume in place: a bigger one is a new lease and a
            # full replay. Each private tx carries ~15 KB of proof per proof
            # (14.6 KB measured), kept for ever in blocks and block results.
            # 200Gi is 2x the validator's 100Gi, which keeps half a year of
            # heavy use far from full; re-check the growth rate in month one.
            size: 200Gi
            attributes:
              persistent: true
              class: beta3

    cloudflared:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 128Mi
        storage:
          - size: 512Mi

  placement:
    dcloud:
      pricing:
        node:
          denom: uakt
          amount: 50000
        cloudflared:
          denom: uakt
          amount: 10000

deployment:
  node:
    dcloud:
      profile: node
      # One. A second replica is a second node on one volume claim, not a
      # second archive.
      count: 1
  cloudflared:
    dcloud:
      profile: cloudflared
      count: 1
